<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>Singular Bot Blocks</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="theme.css"></head>
<body><header><span class="cube" aria-hidden="true"></span><div class="brand"><strong>Singular Bot Blocks</strong><span id="stage">機器人程式工作台</span></div><button id="theme" class="icon-only" data-icon="sun" aria-label="亮色模式" data-tip="亮色模式" aria-pressed="false"></button><button id="history" class="icon-only" data-icon="history" aria-label="我的紀錄" data-tip="我的紀錄"></button><button id="robots" class="icon-only" data-icon="robots" aria-label="我的機器人" data-tip="我的機器人"></button><button id="more" class="icon-only" data-icon="robot" aria-label="機器人設定" data-tip="機器人設定"></button><button id="save" data-icon="check" disabled>已儲存</button><button id="close" data-icon="back">返回</button></header>
<nav id="programbar" aria-label="程式庫"><select id="programs" aria-label="程式庫"><option value="" selected hidden disabled>程式庫</option></select><span class="menu-wrap"><button id="new" data-icon="plus" aria-haspopup="menu" aria-expanded="false">新增</button><span id="newMenu" class="menu" role="menu" hidden><button id="newBlocks" role="menuitem" data-icon="blocks">積木程式</button><button id="newLua" role="menuitem" data-icon="code" hidden>Lua 程式</button></span></span><input id="programName" maxlength="64" aria-label="程式名稱" placeholder="程式名稱"><span id="modeTag" data-mode="blocks" hidden>積木</span><button id="copy" class="icon-only" data-icon="copy" aria-label="另存副本" data-tip="另存副本"></button><button id="convert" data-icon="code" hidden>轉成 Lua</button><button id="recover" data-icon="undo" hidden>復原未存草稿</button><button id="delete" class="icon-only danger" data-icon="trash" aria-label="刪除程式" data-tip="刪除程式"></button></nav>
<nav id="runtimebar" aria-label="執行控制"><span id="runtimeLamp" data-status="stopped" role="status"><span id="runtimeStatus">待命</span></span><button id="run" class="primary" data-icon="play">執行</button><button id="pause" data-icon="pause" disabled>暫停</button><button id="resume" data-icon="play" hidden>繼續</button><button id="step" data-icon="step">逐步</button><button id="stop" class="danger" data-icon="stop" disabled>停止</button><button id="compact" class="icon-only" data-icon="expand" aria-label="放大編輯器" data-tip="放大編輯器" hidden></button></nav>
<nav id="transferbar" aria-label="教師發送" hidden><select id="targets" aria-label="接收學生"><option value="" selected hidden disabled>接收學生</option></select><button id="share" data-icon="send">教師發送</button></nav>
<main><div id="workbench"><div id="workspace"></div><div id="visualDisabled" hidden>老師關閉了積木編輯；還可以用 Lua 寫程式。</div></div><div id="codePane"><pre id="luaLineHighlight" aria-hidden="true"></pre><textarea id="luaEditor" aria-label="Lua 原始碼" spellcheck="false"></textarea></div><aside><h2 id="previewTitle" hidden>Lua 預覽</h2><pre id="preview" hidden></pre><h2 id="variablesTitle" hidden>變數檢視</h2><pre id="variables" hidden></pre><button id="debugSource" hidden>切換到機器人正在執行的程式</button><p id="status" role="status">正在載入本地編輯器…</p><p class="hint" id="suggestion"></p></aside></main><dialog id="historyDialog"><h2 id="historyTitle">我的程式與機器人紀錄</h2><pre id="historyEntries"></pre><button id="historyClose">返回編輯器</button></dialog><dialog id="robotsDialog"><h2 id="robotsTitle">我的機器人</h2><div id="robotsEntries" role="list"></div><p id="robotsStatus" role="status"></p><button id="robotsClose">返回編輯器</button></dialog><dialog id="moreDialog"><h2 id="moreTitle">機器人設定</h2><div class="options"><button id="snapshot">儲存復原點</button><button id="restore" disabled>回到復原點</button><label id="slotLabel" for="selectedSlot">使用物品欄第幾格</label><select id="selectedSlot" aria-label="使用物品欄第幾格"></select><button id="lock" disabled>鎖定機器人</button></div><button id="moreClose">返回編輯器</button></dialog><dialog id="askDialog"><form id="askForm" method="dialog"><p id="askMessage"></p><input id="askInput" maxlength="64" autocomplete="off" spellcheck="false" aria-labelledby="askMessage"><p id="askError" role="alert"></p><div class="ask-actions"><button id="askCancel" type="button">取消</button><button id="askOk" class="primary" type="submit">確定</button></div></form></dialog><script src="editor.js"></script></body></html>

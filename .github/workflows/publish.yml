name: Publish
# Uploads a release to Modrinth (and CurseForge once its id is set). It only
# runs in the public repository, when a version tag v<mod_version> is pushed
# there after the release has been reviewed, or when started by hand.
# Repository settings: secret MODRINTH_TOKEN and variable MODRINTH_ID; for
# CurseForge, secret CURSEFORGE_TOKEN and variable CURSEFORGE_ID.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      changelog:
        description: Changelog text
        required: false
permissions:
  contents: read
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Shen-Ming-Hong/SingularBotBlocks'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
      - name: Version
        id: version
        env:
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match mod_version $version"; exit 1
          fi
          if [ -z "$MODRINTH_ID" ]; then
            echo "::error::Repository variable MODRINTH_ID is not set"; exit 1
          fi
          case "$version" in
            *-dev*|*-alpha*) type=alpha ;;
            *-beta*|*-rc*) type=beta ;;
            *) type=release ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "type=$type" >> "$GITHUB_OUTPUT"
      # A tag pushed after a manual upload (for example once a machine that can
      # push tags is available) must not upload the same version again. A manual
      # run for a version that already exists fails instead.
      - name: Already on Modrinth?
        id: existing
        env:
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          versions=$(curl -fsS --retry 3 -H "Authorization: $MODRINTH_TOKEN" \
            -H 'User-Agent: SingularBotBlocks-publish' \
            "https://api.modrinth.com/v2/project/$MODRINTH_ID/version")
          if printf '%s' "$versions" | jq -e --arg v "$VERSION" 'any(.[]; .version_number == $v)' > /dev/null; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "::notice::Modrinth already has $VERSION; the tag is kept and nothing is uploaded"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Modrinth already has $VERSION; raise mod_version before uploading again"; exit 1
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci --prefix editor --ignore-scripts
        if: steps.existing.outputs.skip != 'true'
      - run: npm test --prefix editor
        if: steps.existing.outputs.skip != 'true'
      - run: ./gradlew build --no-daemon
        if: steps.existing.outputs.skip != 'true'
      - name: Check the JAR
        if: steps.existing.outputs.skip != 'true'
        id: jar
        run: |
          jar="build/libs/singularbots-1.21.1-neoforge-${{ steps.version.outputs.version }}.jar"
          test -f "$jar"
          # Other mods are dependencies, never bundled.
          if unzip -l "$jar" | grep -E ' (dan200|cc/tweaked|com/cinemamod|org/cef|mezz)/'; then
            echo "::error::The JAR contains another mod's classes"; exit 1
          fi
          sha256sum "$jar"
          echo "path=$jar" >> "$GITHUB_OUTPUT"
      - name: Changelog
        if: steps.existing.outputs.skip != 'true'
        env:
          INPUT: ${{ inputs.changelog }}
        run: |
          if [ -n "$INPUT" ]; then
            printf '%s\n' "$INPUT" > changelog.md
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            git fetch --depth=1 origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > changelog.md
          fi
          touch changelog.md
      - uses: Kir-Antipov/mc-publish@v3.3
        if: steps.existing.outputs.skip != 'true'
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ steps.jar.outputs.path }}
          name: Singular Bot Blocks ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          version-type: ${{ steps.version.outputs.type }}
          changelog-file: changelog.md
          loaders: neoforge
          game-versions: '1.21.1'
          java: '21'
          dependencies: |
            cc-tweaked(required)
            mcef(required)
          # The token may only create versions, so leave older versions' featured flag alone.
          modrinth-unfeature-mode: none
          fail-mode: fail
